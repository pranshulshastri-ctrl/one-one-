<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Execute Tracker</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col pb-20 select-none">

    <header class="bg-slate-900/80 backdrop-blur border-b border-slate-800 sticky top-0 z-40 px-4 py-3 safe-top">
        <div class="flex justify-between items-center max-w-md mx-auto">
            <div>
                <h1 class="text-xs font-bold tracking-widest text-slate-400 uppercase">Execute Tracker</h1>
                <div class="text-xl font-extrabold text-emerald-400 mt-0.5" id="header-xp-display">0 XP Today</div>
            </div>
            <button id="edit-mode-btn" onclick="toggleEditMode()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-semibold tracking-wide transition flex items-center gap-1.5">
                <i class="fa-solid fa-pen text-[10px]"></i> <span>EDIT</span>
            </button>
        </div>
    </header>

    <main class="flex-1 max-w-md w-full mx-auto px-4 py-4 space-y-6">
        
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl">
            <div class="flex justify-between items-end mb-2">
                <span class="text-xs font-medium text-slate-400 uppercase tracking-wider">Daily Target Progress</span>
                <span class="text-sm font-bold text-slate-200" id="xp-fraction">0 / 115 XP</span>
            </div>
            <div class="w-full bg-slate-800 h-3 rounded-full overflow-hidden">
                <div id="xp-progress-bar" class="bg-gradient-to-r from-emerald-500 to-teal-400 h-full w-0 transition-all duration-500"></div>
            </div>
            <p class="text-[10px] text-slate-500 mt-2 text-center">Data capacity status: <span class="text-emerald-400 font-medium">Unlimited Storage (70+ Years Secure)</span></p>
        </div>

        <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1" id="category-chips">
            </div>

        <div id="tab-today-content" class="tab-content space-y-3">
            <div id="habits-list" class="space-y-2.5">
                </div>
            <div id="add-habit-container" class="hidden pt-2">
                <button onclick="showAddHabitModal()" class="w-full py-3 border border-dashed border-slate-700 hover:border-slate-500 rounded-xl text-xs font-medium text-slate-400 hover:text-slate-200 transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-plus"></i> Add New Habit
                </button>
            </div>
        </div>

        <div id="tab-week-content" class="tab-content hidden space-y-4">
            <h2 class="text-sm font-bold tracking-wider text-slate-400 uppercase">Weekly Performance</h2>
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                <canvas id="weeklyChart" class="w-full h-48"></canvas>
            </div>
        </div>

        <div id="tab-stats-content" class="tab-content hidden space-y-4">
            <h2 class="text-sm font-bold tracking-wider text-slate-400 uppercase">All-Time Statistics</h2>
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                    <div class="text-[10px] uppercase tracking-wider text-slate-500">Total Days Tracked</div>
                    <div class="text-2xl font-black text-slate-200 mt-1" id="stat-total-days">0</div>
                </div>
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                    <div class="text-[10px] uppercase tracking-wider text-slate-500">All-Time XP</div>
                    <div class="text-2xl font-black text-emerald-400 mt-1" id="stat-total-xp">0</div>
                </div>
            </div>
        </div>

        <div id="tab-money-content" class="tab-content hidden space-y-4">
            <h2 class="text-sm font-bold tracking-wider text-slate-400 uppercase">Finance Ledger</h2>
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl space-y-2">
                <div class="flex justify-between"><span>Current Balance:</span><span class="font-bold text-emerald-400" id="finance-balance">₹0</span></div>
            </div>
        </div>

        <div id="tab-spend-content" class="tab-content hidden space-y-4">
            <h2 class="text-sm font-bold tracking-wider text-slate-400 uppercase">Expenses</h2>
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl text-center text-slate-500 text-xs">
                No recent expenses logged.
            </div>
        </div>

    </main>

    <div id="habit-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-sm p-5 space-y-4">
            <h3 class="text-base font-bold text-slate-200" id="modal-title">Add New Habit</h3>
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block text-slate-400 mb-1">Habit Name</label>
                    <input type="text" id="modal-habit-name" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-slate-100 focus:outline-none focus:border-emerald-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-slate-400 mb-1">Icon (Emoji)</label>
                        <input type="text" id="modal-habit-icon" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-center text-lg focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1">XP Reward</label>
                        <input type="number" id="modal-habit-xp" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 focus:outline-none focus:border-emerald-500">
                    </div>
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Category</label>
                    <input type="text" id="modal-habit-category" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-slate-100 focus:outline-none focus:border-emerald-500" placeholder="discipline, body, growth...">
                </div>
            </div>
            <div class="flex gap-2 text-xs font-semibold pt-2">
                <button onclick="closeHabitModal()" class="flex-1 py-2.5 rounded-lg bg-slate-800 hover:bg-slate-700 transition">Cancel</button>
                <button onclick="saveHabitModal()" class="flex-1 py-2.5 rounded-lg bg-emerald-500 hover:bg-emerald-600 text-slate-950 transition">Save Changes</button>
            </div>
        </div>
    </div>

    <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur border-t border-slate-800 py-2 safe-bottom z-40">
        <div class="max-w-md mx-auto grid grid-cols-5 text-center">
            <button onclick="switchTab('today')" id="nav-today" class="flex flex-col items-center gap-0.5 text-emerald-400 transition">
                <span class="text-lg">⚡</span><span class="text-[9px] font-bold uppercase tracking-wider">Today</span>
            </button>
            <button onclick="switchTab('week')" id="nav-week" class="flex flex-col items-center gap-0.5 text-slate-500 transition">
                <span class="text-lg">📊</span><span class="text-[9px] font-bold uppercase tracking-wider">Week</span>
            </button>
            <button onclick="switchTab('stats')" id="nav-stats" class="flex flex-col items-center gap-0.5 text-slate-500 transition">
                <span class="text-lg">🔥</span><span class="text-[9px] font-bold uppercase tracking-wider">Stats</span>
            </button>
            <button onclick="switchTab('money')" id="nav-money" class="flex flex-col items-center gap-0.5 text-slate-500 transition">
                <span class="text-lg">₹</span><span class="text-[9px] font-bold uppercase tracking-wider">Money</span>
            </button>
            <button onclick="switchTab('spend')" id="nav-spend" class="flex flex-col items-center gap-0.5 text-slate-500 transition">
                <span class="text-lg">💸</span><span class="text-[9px] font-bold uppercase tracking-wider">Spend</span>
            </button>
        </div>
    </nav>

    <script>
        let habits = [];
        let history = {}; 
        let currentTab = 'today';
        let isEditMode = false;
        let activeCategoryFilter = 'all';
        let editingHabitId = null;
        let chartInstance = null;

        const defaultHabits = [
            { id: 'h1', name: 'Wake by 7:30 AM', icon: '⚡', xp: 10, category: 'discipline' },
            { id: 'h2', name: 'Workout done', icon: '💪', xp: 15, category: 'body' },
            { id: 'h3', name: 'German 90 mins', icon: '🇩🇪', xp: 15, category: 'german' },
            { id: 'h4', name: 'No porn', icon: '🔒', xp: 20, category: 'discipline' },
            { id: 'h5', name: 'Scroll under 30 min', icon: '📵', xp: 10, category: 'discipline' },
            { id: 'h6', name: 'Sleep by 12:15 AM', icon: '🌙', xp: 10, category: 'discipline' },
            { id: 'h7', name: 'Career block 90 min', icon: '📈', xp: 15, category: 'career' },
            { id: 'h8', name: 'No food delivery', icon: '🥗', xp: 10, category: 'discipline' },
            { id: 'h9', name: 'Read 20 pages', icon: '📖', xp: 5, category: 'growth' },
            { id: 'h10', name: 'Post-shift walk', icon: '🚶', xp: 5, category: 'body' }
        ];

        function getTodayString() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }

        function initApp() {
            // Load habits
            const savedHabits = localStorage.getItem('ex_habits');
            if (savedHabits) {
                habits = JSON.parse(savedHabits);
            } else {
                habits = [...defaultHabits];
                localStorage.setItem('ex_habits', JSON.stringify(habits));
            }

            // Load comprehensive history data (Migration checking included)
            const oldHistory = localStorage.getItem('execute_history');
            const savedHistory = localStorage.getItem('ex_hist');
            
            if (oldHistory && !savedHistory) {
                history = JSON.parse(oldHistory);
                localStorage.setItem('ex_hist', JSON.stringify(history));
            } else if (savedHistory) {
                history = JSON.parse(savedHistory);
            } else {
                history = {};
            }

            // Ensure today exists in logs
            const today = getTodayString();
            if (!history[today]) {
                history[today] = [];
            }

            renderCategoryChips();
            renderHabits();
            updateXPProgress();
            renderStats();
        }

        function saveState() {
            localStorage.setItem('ex_habits', JSON.stringify(habits));
            localStorage.setItem('ex_hist', JSON.stringify(history));
        }

        function toggleHabit(id) {
            if (isEditMode) return;
            const today = getTodayString();
            const index = history[today].indexOf(id);
            if (index > -1) {
                history[today].splice(index, 1);
            } else {
                history[today].push(id);
            }
            saveState();
            renderHabits();
            updateXPProgress();
            renderStats();
            if (currentTab === 'week') updateWeeklyChart();
        }

        function updateXPProgress() {
            const today = getTodayString();
            const completedIds = history[today] || [];
            
            let earnedXP = 0;
            let totalPossibleXP = 0;

            habits.forEach(h => {
                totalPossibleXP += h.xp;
                if (completedIds.includes(h.id)) {
                    earnedXP += h.xp;
                }
            });

            document.getElementById('header-xp-display').innerText = `${earnedXP} XP Today`;
            document.getElementById('xp-fraction').innerText = `${earnedXP} / ${totalPossibleXP} XP`;
            
            const percentage = totalPossibleXP > 0 ? (earnedXP / totalPossibleXP) * 100 : 0;
            document.getElementById('xp-progress-bar').style.width = `${Math.min(percentage, 100)}%`;
        }

        function renderCategoryChips() {
            const container = document.getElementById('category-chips');
            const categories = ['all', ...new Set(habits.map(h => h.category).filter(Boolean))];
            
            container.innerHTML = categories.map(cat => {
                const isActive = activeCategoryFilter === cat;
                return `
                    <button onclick="setCategoryFilter('${cat}')" class="px-3.5 py-1 rounded-full text-xs font-bold uppercase tracking-wider whitespace-nowrap transition border ${
                    isActive ? 'bg-emerald-500 text-slate-950 border-emerald-500' : 'bg-slate-900 text-slate-400 border-slate-800 hover:border-slate-700'
                }">
                        ${cat}
                    </button>
                `;
            }).join('');
        }

        function setCategoryFilter(cat) {
            activeCategoryFilter = cat;
            renderCategoryChips();
            renderHabits();
        }

        function renderHabits() {
            const container = document.getElementById('habits-list');
            const today = getTodayString();
            const completedIds = history[today] || [];

            const filteredHabits = activeCategoryFilter === 'all' 
                ? habits 
                : habits.filter(h => h.category === activeCategoryFilter);

            if (filteredHabits.length === 0) {
                container.innerHTML = `<p class="text-slate-500 text-xs text-center py-6">No habits found in this category.</p>`;
                return;
            }

            container.innerHTML = filteredHabits.map(h => {
                const isDone = completedIds.includes(h.id);
                return `
                    <div class="group relative flex items-center justify-between bg-slate-900 border ${isDone ? 'border-emerald-500/30 bg-emerald-950/10' : 'border-slate-800'} p-3.5 rounded-xl transition active:scale-[0.99] cursor-pointer" onclick="toggleHabit('${h.id}')">
                        <div class="flex items-center gap-3.5 flex-1 min-w-0">
                            <span class="text-xl w-7 text-center">${h.icon || '⚡'}</span>
                            <div class="min-w-0">
                                <p class="text-sm font-semibold transition ${isDone ? 'text-slate-400 line-through' : 'text-slate-200'}">${h.name}</p>
                                <span class="inline-block text-[9px] uppercase tracking-wider font-bold text-slate-500 bg-slate-800 px-1.5 py-0.5 rounded mt-1">${h.category}</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="text-xs font-bold tracking-wide ${isDone ? 'text-emerald-400' : 'text-slate-400'}">${h.xp} XP</span>
                            ${isEditMode ? `
                                <div class="flex items-center gap-1.5 z-10" onclick="event.stopPropagation();">
                                    <button onclick="editHabit('${h.id}')" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-slate-300 transition">
                                        <i class="fa-solid fa-pencil text-xs"></i>
                                    </button>
                                    <button onclick="deleteHabit('${h.id}')" class="w-8 h-8 rounded-lg bg-red-950/40 hover:bg-red-900/60 flex items-center justify-center text-red-400 border border-red-900/40 transition">
                                        <i class="fa-solid fa-trash-can text-xs"></i>
                                    </button>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleEditMode() {
            isEditMode = !isEditMode;
            const btn = document.getElementById('edit-mode-btn');
            const addContainer = document.getElementById('add-habit-container');
            
            if (isEditMode) {
                btn.className = "px-3 py-1.5 rounded-lg bg-emerald-500 text-slate-950 text-xs font-bold tracking-wide transition flex items-center gap-1.5";
                addContainer.classList.remove('hidden');
            } else {
                btn.className = "px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-semibold tracking-wide transition flex items-center gap-1.5";
                addContainer.classList.add('hidden');
            }
            renderHabits();
        }

        function showAddHabitModal() {
            editingHabitId = null;
            document.getElementById('modal-title').innerText = "Add New Habit";
            document.getElementById('modal-habit-name').value = "";
            document.getElementById('modal-habit-icon').value = "⚡";
            document.getElementById('modal-habit-xp').value = "10";
            document.getElementById('modal-habit-category').value = "discipline";
            document.getElementById('habit-modal').classList.remove('hidden');
        }

        function editHabit(id) {
            const h = habits.find(habit => habit.id === id);
            if (!h) return;
            editingHabitId = id;
            document.getElementById('modal-title').innerText = "Modify Habit Settings";
            document.getElementById('modal-habit-name').value = h.name;
            document.getElementById('modal-habit-icon').value = h.icon || '⚡';
            document.getElementById('modal-habit-xp').value = h.xp;
            document.getElementById('modal-habit-category').value = h.category || 'discipline';
            document.getElementById('habit-modal').classList.remove('hidden');
        }

        function saveHabitModal() {
            const name = document.getElementById('modal-habit-name').value.trim();
            const icon = document.getElementById('modal-habit-icon').value.trim() || '⚡';
            const xp = parseInt(document.getElementById('modal-habit-xp').value) || 10;
            const category = document.getElementById('modal-habit-category').value.trim().toLowerCase() || 'discipline';

            if (!name) return alert('Habit name cannot be empty.');

            if (editingHabitId) {
                // Editing existing
                const h = habits.find(habit => habit.id === editingHabitId);
                if (h) {
                    h.name = name;
                    h.icon = icon;
                    h.xp = xp;
                    h.category = category;
                }
            } else {
                // Adding new
                const newId = 'h_' + Date.now();
                habits.push({ id: newId, name, icon, xp, category });
            }

            saveState();
            closeHabitModal();
            renderCategoryChips();
            renderHabits();
            updateXPProgress();
        }

        function deleteHabit(id) {
            if (!confirm("Are you sure you want to delete this habit permanently?")) return;
            habits = habits.filter(h => h.id !== id);
            saveState();
            renderCategoryChips();
            renderHabits();
            updateXPProgress();
        }

        function closeHabitModal() {
            document.getElementById('habit-modal').classList.add('hidden');
        }

        function switchTab(tabId) {
            currentTab = tabId;
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${tabId}-content`).classList.remove('hidden');

            // Manage nav button active colors
            ['today', 'week', 'stats', 'money', 'spend'].forEach(t => {
                const el = document.getElementById(`nav-${t}`);
                if (t === tabId) {
                    el.classList.replace('text-slate-500', 'text-emerald-400');
                } else {
                    el.classList.replace('text-emerald-400', 'text-slate-500');
                }
            });

            if (tabId === 'week') updateWeeklyChart();
            if (tabId === 'stats') renderStats();
        }

        function renderStats() {
            const daysTracked = Object.keys(history).length;
            let totalXPAllTime = 0;

            Object.keys(history).forEach(date => {
                const checkedIds = history[date] || [];
                checkedIds.forEach(id => {
                    const h = habits.find(habit => habit.id === id);
                    if (h) totalXPAllTime += h.xp;
                });
            });

            document.getElementById('stat-total-days').innerText = daysTracked;
            document.getElementById('stat-total-xp').innerText = `${totalXPAllTime} XP`;
        }

        function updateWeeklyChart() {
            const ctx = document.getElementById('weeklyChart').getContext('2d');
            const labels = [];
            const dataValues = [];

            // Grab the past 7 days chronologically
            for (let i = 6; i >= 0; i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                const dateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                
                const labelDay = d.toLocaleDateString('en-US', { weekday: 'short' });
                labels.push(labelDay);

                let dayXP = 0;
                const checkedIds = history[dateStr] || [];
                checkedIds.forEach(id => {
                    const h = habits.find(habit => habit.id === id);
                    if (h) dayXP += h.xp;
                });
                dataValues.push(dayXP);
            }

            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Daily XP',
                        data: dataValues,
                        backgroundColor: '#10b981',
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { grid: { color: '#1e293b' }, ticks: { color: '#94a3b8' } },
                        x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
                    }
                }
            });
        }

        window.onload = initApp;
    </script>
</body>
</html>
